# Full-stack local / VPS deployment
# Usage:
#   1. Copy .env.deploy.example -> .env.deploy and fill values
#   2. Copy backend/.env.example -> backend/.env and set DATABASE_URL, JWT secrets
#   3. docker compose --env-file .env.deploy up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
        NEXT_PUBLIC_FIRECONNECT_CLIENT_KEY: ${NEXT_PUBLIC_FIRECONNECT_CLIENT_KEY:-}
        NEXT_PUBLIC_FIRECONNECT_CLIENT_SECRET: ${NEXT_PUBLIC_FIRECONNECT_CLIENT_SECRET:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Server-side PDF routes (Razorpay, WhatsApp) — not exposed to browser
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
    depends_on:
      - backend

volumes:
  backend_uploads:
